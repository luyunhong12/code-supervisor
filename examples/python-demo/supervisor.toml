version = 1
name = "python-demo"
source = ["calculator.py", "test_calculator.py"]
checks = ["python-docs", "black", "ruff", "pyright", "security", "secrets", "crapper", "dryer", "mutator"]

[settings.pyright]
files = ["calculator.py"]
[settings.security]
files = ["calculator.py"]
[settings.secrets]
paths = ["calculator.py", "test_calculator.py", "supervisor.toml"]
[settings.crapper]
files = ["calculator.py"]
inputs = ["calculator.py", "test_calculator.py"]
pytest_args = ["test_calculator.py"]
[settings.dryer]
files = ["calculator.py"]
[settings.mutator]
files = ["calculator.py"]
inputs = ["calculator.py", "test_calculator.py"]
pytest_args = ["test_calculator.py"]
max_mutants = 10
mutant_timeout = 30
