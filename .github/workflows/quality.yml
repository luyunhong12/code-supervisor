name: Supervisor verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ doxygen
      - run: bash scripts/bootstrap.sh
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python -m pytest -q -p no:cacheprovider
      - run: .venv/bin/supervisor check . --profile full --run-commands
      - run: .venv/bin/supervisor check examples/python-demo --profile deep --run-commands
      - run: .venv/bin/supervisor check examples/cpp-demo --profile deep --run-commands
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-evidence
          path: |
            .generated/supervisor/**/report.*
            examples/*/.generated/supervisor/**/report.*
