[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-supervisor-local"
version = "0.1.0"
description = "跨项目中文代码督导：Python Google 文档、C++ Doxygen 与证据报告"
requires-python = ">=3.11"
dependencies = ["black==24.10.0", "ruff==0.14.3", "tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4"]

[project.scripts]
supervisor = "code_supervisor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
